name: debug
on:
  pull_request:

# actions/github-script with the forge client in scope and never a call to it:
# the body only writes to the log and sets variables for later steps. What the
# action can do is not what this workflow does.
jobs:
  env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            Object.keys(process.env).forEach(k => {
              core.info(k)
              core.exportVariable(k, process.env[k])
            })
