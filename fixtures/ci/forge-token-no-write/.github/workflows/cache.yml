name: cache
"on":
  push:
  pull_request:

# The population the carve-out decides on its own: the forge's own token is
# referenced, and nothing in the pipeline writes to the forge. Read as a
# credential the repository would be read-credential; read as the forge's own
# minting it is self-contained, which is the reading taken here.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install -r requirements.txt
      - run: pytest -q
