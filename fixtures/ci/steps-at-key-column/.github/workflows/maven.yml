name: ci
on:
  pull_request:

# The `steps:` whose items are not indented past it. Legal YAML, a sixth of
# a corpus's workflows, and before the line reader admitted a sequence at the
# key's own column it read as an empty block: every privilege in the job landed
# in the frame, where no step could be held responsible for it, and a workflow
# whose only credential feeds a code-quality upload reported an unattributable
# privilege instead of reporting-only.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Build and analyse
      run: mvn -B verify sonar:sonar
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
