name: image
on:
  push:
    branches: [main]
  pull_request:

# The push is conditional, not absent: the same workflow builds on a pull
# request and publishes on main. This is the expression form GitHub's own
# starter workflow for the action uses.
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/example/app:latest
